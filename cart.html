<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — Thevey Brand International</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">TB</div>
          <div>
            <p class="brand-name">THEVEY BRAND</p>
            <p class="brand-subtitle">INTERNATIONAL</p>
          </div>
        </div>
        <nav class="top-nav" id="siteNav">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="product.html?id=1">Product</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
        <a class="icon-btn" href="cart.html">Bag <span id="cartCount">0</span></a>
      </header>

      <main class="page-content cart-page">
        <section class="section-block">
          <div class="section-heading">
            <p class="eyebrow">YOUR BAG</p>
            <h3>Ready for checkout.</h3>
          </div>
          <div class="cart-layout">
            <div class="cart-list" id="cartList"></div>
            <aside class="summary-card">
              <h4>Order Summary</h4>
              <div class="summary-row"><span>Subtotal</span><strong id="subtotal">$0</strong></div>
              <p class="summary-note">Shipping and taxes calculated at checkout.</p>
              <a class="primary-btn" href="contact.html">Reserve your order</a>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="product.html?id=1">Product</a>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
